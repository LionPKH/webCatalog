{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DecorStudio · Art-ателье ручных композиций{% endblock %}</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Manrope:wght@400;500;600;700;800&family=Cormorant+Infant:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'ui-sans-serif', 'system-ui'],
                        serif: ['"Cormorant Garamond"', 'serif'],
                        display: ['"Cormorant Infant"', 'serif'],
                    },
                    colors: {
                        gold: {
                            50:  '#faf4e1',
                            100: '#f3e7c0',
                            200: '#e8d599',
                            300: '#dcc171',
                            400: '#d0ad4f',
                            500: '#C9A961',
                            600: '#a3863e',
                            700: '#8a6f2e',
                            800: '#6b5520',
                            900: '#4a3a16',
                        },
                        ivory: '#faf6ec',
                        cream: '#f1e8d2',
                        ink:   '#0c100f',
                        graphite: '#1a201e',
                        /* Совместимость со старыми классами Tiffany — теперь золотая палитра */
                        tiffany: {
                            50:  '#faf4e1',
                            100: '#f3e7c0',
                            200: '#e8d599',
                            300: '#dcc171',
                            400: '#d0ad4f',
                            500: '#C9A961',
                            600: '#a3863e',
                            700: '#8a6f2e',
                            800: '#6b5520',
                            900: '#4a3a16',
                        },
                    },
                    boxShadow: {
                        'soft':  '0 12px 38px -18px rgba(20, 20, 10, 0.22)',
                        'glow':  '0 24px 70px -28px rgba(138, 111, 46, 0.55)',
                        'gold':  '0 24px 70px -28px rgba(138, 111, 46, 0.55)',
                        'deep':  '0 30px 80px -30px rgba(12, 16, 15, 0.55)',
                        'press': 'inset 0 1px 0 rgba(255,255,255,0.18), 0 14px 30px -12px rgba(12, 16, 15, 0.35)',
                    },
                    animation: {
                        'fade-up':     'fade-up 0.9s ease-out both',
                        'fade-in':     'fade-in 1s ease-out both',
                        'float':       'float 8s ease-in-out infinite',
                        'float-slow':  'float 12s ease-in-out infinite',
                        'spin-slower': 'spin 80s linear infinite',
                        'marquee':     'marquee 45s linear infinite',
                        'shimmer':     'shimmer 6s ease-in-out infinite',
                    },
                    keyframes: {
                        'fade-up':  { '0%': { opacity: '0', transform: 'translateY(28px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        'fade-in':  { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
                        'float':    { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } },
                        'marquee':  { '0%': { transform: 'translateX(0)' }, '100%': { transform: 'translateX(-50%)' } },
                        'shimmer':  { '0%, 100%': { backgroundPosition: '0% 50%' }, '50%': { backgroundPosition: '100% 50%' } },
                    },
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="{% static 'catalog/css/style.css' %}">
</head>
<body class="font-sans flex flex-col min-h-screen bg-ivory text-ink antialiased">

<!-- Очень мягкий фон — почти невидимая текстура из тёплых пятен -->
<div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-40 -left-40 w-[560px] h-[560px] rounded-full bg-gold-100/40 blur-3xl"></div>
    <div class="absolute top-1/3 -right-40 w-[520px] h-[520px] rounded-full bg-cream blur-3xl opacity-60"></div>
    <div class="absolute bottom-0 left-1/3 w-[420px] h-[420px] rounded-full bg-gold-200/25 blur-3xl"></div>
</div>

{% include 'catalog/header.html' %}

<main class="flex-grow">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 lg:py-12">
        {% block content %}{% endblock %}
    </div>
</main>

{% include 'catalog/footer.html' %}

<!-- Кнопка «наверх» -->
<button id="scroll-top"
        aria-label="Наверх"
        class="fixed bottom-6 right-6 z-40 w-12 h-12 rounded-full bg-ink text-gold-300 shadow-deep opacity-0 invisible translate-y-2 transition-all duration-300 hover:text-gold-100 hover:scale-110 flex items-center justify-center ring-1 ring-gold-500/40">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
</button>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    // Карусели
    if (document.querySelector('.hero-swiper')) {
        new Swiper('.hero-swiper', {
            loop: true,
            effect: 'fade',
            fadeEffect: { crossFade: true },
            autoplay: { delay: 6000, disableOnInteraction: false },
            speed: 2400,
        });
    }
    if (document.querySelector('.product-swiper')) {
        new Swiper('.product-swiper', {
            slidesPerView: 1.1,
            spaceBetween: 20,
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
            breakpoints: {
                640:  { slidesPerView: 2,  spaceBetween: 20 },
                1024: { slidesPerView: 3,  spaceBetween: 24 },
                1280: { slidesPerView: 4,  spaceBetween: 28 },
            }
        });
    }

    // Мобильное меню
    const btn = document.getElementById('mobile-menu-button');
    const menu = document.getElementById('mobile-menu');
    const hamburgerIcon = document.getElementById('hamburger-icon');
    const closeIcon = document.getElementById('close-icon');
    if (btn && menu) {
        btn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            hamburgerIcon.classList.toggle('hidden');
            closeIcon.classList.toggle('hidden');
            document.body.style.overflow = menu.classList.contains('hidden') ? 'auto' : 'hidden';
        });
        menu.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                menu.classList.add('hidden');
                hamburgerIcon.classList.remove('hidden');
                closeIcon.classList.add('hidden');
                document.body.style.overflow = 'auto';
            });
        });
    }

    // Раскрывающийся поиск
    const searchToggle = document.getElementById('search-toggle');
    const searchPanel  = document.getElementById('search-panel');
    const searchInput  = document.getElementById('search-input');
    if (searchToggle && searchPanel) {
        searchToggle.addEventListener('click', () => {
            searchPanel.classList.toggle('search-open');
            if (searchPanel.classList.contains('search-open')) {
                setTimeout(() => searchInput && searchInput.focus(), 200);
            }
        });
    }

    // Скролл-эффекты
    const scrollBtn  = document.getElementById('scroll-top');
    const siteHeader = document.getElementById('site-header');
    window.addEventListener('scroll', () => {
        if (scrollBtn) {
            if (window.scrollY > 400) scrollBtn.classList.remove('opacity-0', 'invisible', 'translate-y-2');
            else scrollBtn.classList.add('opacity-0', 'invisible', 'translate-y-2');
        }
        if (siteHeader) {
            if (window.scrollY > 20) siteHeader.classList.add('header-scrolled');
            else siteHeader.classList.remove('header-scrolled');
        }
    });
    if (scrollBtn) scrollBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // Плавное появление
    if ('IntersectionObserver' in window) {
        const io = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('reveal-in');
                    io.unobserve(entry.target);
                }
            });
        }, { threshold: 0.08 });
        document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    }

    // Параллакс
    const parallaxEls = document.querySelectorAll('[data-parallax]');
    if (parallaxEls.length && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        window.addEventListener('scroll', () => {
            const y = window.scrollY;
            parallaxEls.forEach(el => {
                const speed = parseFloat(el.dataset.parallax) || 0.12;
                el.style.transform = `translateY(${y * speed}px)`;
            });
        }, { passive: true });
    }

    // Лёгкий tilt
    if (!matchMedia('(pointer: coarse)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.querySelectorAll('.tilt').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const r = card.getBoundingClientRect();
                const x = (e.clientX - r.left) / r.width - 0.5;
                const y = (e.clientY - r.top) / r.height - 0.5;
                card.style.transform = `perspective(1100px) rotateX(${ -y * 3.5 }deg) rotateY(${ x * 4 }deg) translateY(-3px)`;
            });
            card.addEventListener('mouseleave', () => { card.style.transform = ''; });
        });
    }
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
