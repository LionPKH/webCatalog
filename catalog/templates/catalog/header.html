<header id="site-header" class="sticky top-0 z-50 transition-all duration-300">
    <div class="bg-ivory/85 backdrop-blur-lg border-b border-gold-200/40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center gap-6">

            <!-- Логотип -->
            <a href="{% url 'index' %}" class="flex items-center gap-3 group z-50 shrink-0">
                <div class="relative w-12 h-12 rounded-2xl grid place-items-center bg-gradient-to-br from-tiffany-400 via-tiffany-500 to-tiffany-700 shadow-glow group-hover:rotate-3 group-hover:scale-105 transition-transform duration-500 ring-1 ring-gold-300/40">
                    <span class="absolute -inset-1 rounded-3xl bg-gold-300/20 blur-md opacity-0 group-hover:opacity-100 transition"></span>
                    <svg class="relative w-5 h-5 text-ivory" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2L4 8l8 14 8-14-8-6z" opacity="0.95"/>
                    </svg>
                </div>
                <div class="flex flex-col leading-none">
                    <span class="font-display text-3xl font-bold tracking-tight text-ink">Decor<span class="text-shimmer italic">Studio</span></span>
                    <span class="text-[10px] uppercase tracking-[0.35em] text-gold-700 mt-1.5 font-semibold">Art atelier · est. 2021</span>
                </div>
            </a>

            <!-- Десктоп навигация -->
            <nav class="hidden md:block">
                <ul class="flex gap-1 items-center">
                    <li><a href="{% url 'index' %}" class="nav-link">Главная</a></li>
                    <li><a href="{% url 'product_list' %}" class="nav-link">Каталог</a></li>
                    <li><a href="{% url 'product_list' %}?sort=popular" class="nav-link">Хиты</a></li>
                    <li><a href="{% url 'product_list' %}?sort=newest" class="nav-link">Новинки</a></li>
                    <li><a href="#contact" class="nav-link">Контакты</a></li>
                </ul>
            </nav>

            <!-- Правая группа -->
            <div class="flex items-center gap-2">
                <button id="search-toggle"
                        aria-label="Поиск"
                        class="w-11 h-11 rounded-full border border-gold-300/50 bg-ivory text-stone-700 hover:text-tiffany-700 hover:border-tiffany-400 hover:shadow-soft transition flex items-center justify-center">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>

                <a href="https://t.me/your_account" target="_blank" rel="noopener"
                   class="hidden sm:inline-flex items-center gap-2 px-4 h-11 rounded-full bg-ink text-gold-300 text-sm font-semibold border border-gold-500/30 hover:text-gold-100 transition shadow-soft">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M21.94 4.36L18.86 19.07c-.23 1.04-.85 1.29-1.72.8l-4.76-3.51-2.3 2.21c-.25.25-.47.47-.96.47l.34-4.86 8.85-8c.39-.34-.08-.53-.6-.19L6.78 12.34l-4.7-1.47c-1.02-.32-1.04-1.02.21-1.51L20.7 2.95c.85-.32 1.6.19 1.24 1.41z"/>
                    </svg>
                    <span>Заказать</span>
                </a>

                <button id="mobile-menu-button" class="md:hidden w-11 h-11 rounded-full border border-gold-300/50 bg-ivory text-stone-700 hover:text-tiffany-700 hover:border-tiffany-400 transition flex items-center justify-center z-50">
                    <svg id="hamburger-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16"/>
                    </svg>
                    <svg id="close-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Раскрывающаяся панель поиска -->
        <div id="search-panel" class="search-panel overflow-hidden border-t border-gold-200/30 bg-ivory/95 backdrop-blur-lg">
            <form action="{% url 'product_list' %}" method="get" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                <div class="flex items-center gap-3">
                    <div class="relative flex-grow">
                        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gold-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="7"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input id="search-input" type="search" name="q"
                               placeholder="Найти композицию, букет или подарок…"
                               class="w-full pl-12 pr-4 py-3.5 rounded-full bg-cream/60 border border-gold-200/50 focus:border-tiffany-400 focus:bg-white focus:outline-none focus:ring-4 focus:ring-tiffany-100 text-base font-serif"/>
                    </div>
                    <button type="submit" class="hidden sm:inline-flex btn-gold !py-3.5 !px-7">
                        Найти
                    </button>
                </div>
                <p class="mt-3 text-xs text-stone-500 font-medium uppercase tracking-[0.2em]">
                    Популярные запросы:
                    <a href="{% url 'product_list' %}?q=весна" class="text-tiffany-700 hover:underline ml-2">весна</a>
                    <a href="{% url 'product_list' %}?q=новый+год" class="text-tiffany-700 hover:underline ml-2">новый год</a>
                    <a href="{% url 'product_list' %}?q=подарок" class="text-tiffany-700 hover:underline ml-2">подарок</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Мобильное меню -->
    <div id="mobile-menu" class="hidden absolute top-0 left-0 w-full bg-ivory shadow-2xl z-40 border-b border-gold-200/40 pt-24 pb-12 px-6 transition-all duration-300">
        <ul class="flex flex-col gap-3 text-center">
            <li><a href="{% url 'index' %}" class="block text-2xl font-serif font-bold text-ink hover:text-tiffany-700 py-2">Главная</a></li>
            <li><a href="{% url 'product_list' %}" class="block text-2xl font-serif font-bold text-ink hover:text-tiffany-700 py-2">Каталог</a></li>
            <li><a href="{% url 'product_list' %}?sort=popular" class="block text-2xl font-serif font-bold text-ink hover:text-tiffany-700 py-2">Хиты</a></li>
            <li><a href="{% url 'product_list' %}?sort=newest" class="block text-2xl font-serif font-bold text-ink hover:text-tiffany-700 py-2">Новинки</a></li>
            <li><a href="#contact" class="block text-2xl font-serif font-bold text-ink hover:text-tiffany-700 py-2">Контакты</a></li>
        </ul>
        <div class="ornament mt-8"><span class="diamond"></span></div>
    </div>
</header>
